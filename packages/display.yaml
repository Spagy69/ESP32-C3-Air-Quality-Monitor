font:
  - file: "gfonts://Roboto"
    id: font_big
    size: 16
    # "~" is the warm-up marker on the temperature pages. It has to be in
    # this glyph list or it simply won't render - a glyph-restricted font
    # silently drops anything not listed.
    glyphs: "0123456789.-%~"
  - file: "gfonts://Roboto"
    id: font_label
    size: 10
  # Settings-menu state value (ZAPNUTO/VYPNUTO/DOMA/CESTA/CUSTOM/"10 MIN") -
  # bigger than font_label for legibility, full charset (not glyph-limited
  # like font_big) since these are words, not just numbers.
  - file: "gfonts://Roboto"
    id: font_menu_value
    size: 14

# ---------------------------------------------------------------------------
# Display, tuned for 128x32 (no clipping). Render order: settings menu, then
# the CO2 alarm screen (if active), then the normal 5-page sensor rotation.
#
# Sensor pages always prefer a sensor's live state and fall back to the
# last-known-good cached value (packages/globals.yaml, restore_value: true)
# until the first fresh reading of this boot lands - so the display shows
# correct-looking values immediately after power-on/wake instead of "--" or
# a loading bar. Cached values persist across deep sleep AND a full power
# cycle via the battery switch, since they're flash-backed.
# ---------------------------------------------------------------------------
display:
  - platform: ssd1306_i2c
    id: oled_display
    address: 0x3C
    model: "SSD1306 128x32"
    update_interval: 1s
    lambda: |-
      if (!id(display_on)) return;

      // --- Settings menu (hold button 5s+ to enter) ---
      //
      // Layout mirrors the normal sensor pages below (label top-left,
      // big value centered, position dots bottom) instead of stacking
      // name/state/hint as three separate text lines - that older layout
      // let a long hint string ("5s: dalsi hodnota") run underneath and
      // collide with the position dots, and lowercase descenders in the
      // hint ("vypnout"/"zapnout"/"prepnout") got clipped by the display's
      // bottom edge. Dropping the per-item hint (the 5s-hold convention is
      // the same for every item - see README "Menu a presety") removes
      // both problems instead of just repositioning them.
      if (id(in_settings_menu)) {
        const char *item_name;
        char state_buf[16];
        switch (id(settings_menu_index)) {
          case 0: {  // REZIM - must mirror the match logic in
                     // packages/menu.yaml's 5s-hold handler exactly.
            item_name = "REZIM";
            bool is_doma = id(ha_connection_enabled)
                && !id(deep_sleep_mode_enabled)
                && !id(co2_alarm_enabled)
                && id(asc_enabled);
            bool is_cesta = !id(ha_connection_enabled)
                && id(deep_sleep_mode_enabled)
                && id(sleep_interval_minutes) == 10
                && id(co2_alarm_enabled)
                && !id(asc_enabled);
            if (is_doma)       snprintf(state_buf, sizeof(state_buf), "DOMA");
            else if (is_cesta) snprintf(state_buf, sizeof(state_buf), "CESTA");
            else               snprintf(state_buf, sizeof(state_buf), "CUSTOM");
            break;
          }
          case 1:  // HA připojení (WiFi)
            item_name = "HA PRIPOJENI";
            snprintf(state_buf, sizeof(state_buf), id(ha_connection_enabled) ? "ZAPNUTO" : "VYPNUTO");
            break;
          case 2:  // Interval hlubokého spánku
            item_name = "INTERVAL SPANKU";
            snprintf(state_buf, sizeof(state_buf), "%d MIN", id(sleep_interval_minutes));
            break;
          case 3:  // Automatický hluboký spánek
            item_name = "DEEP SLEEP";
            snprintf(state_buf, sizeof(state_buf), id(deep_sleep_mode_enabled) ? "ZAPNUTO" : "VYPNUTO");
            break;
          case 4:  // Lokální CO2 alarm
            item_name = "CO2 ALARM";
            snprintf(state_buf, sizeof(state_buf), id(co2_alarm_enabled) ? "ZAPNUTO" : "VYPNUTO");
            break;
          case 5:  // SCD41 automatic self-calibration
            item_name = "ASC KALIBRACE";
            snprintf(state_buf, sizeof(state_buf), id(asc_enabled) ? "ZAPNUTO" : "VYPNUTO");
            break;
          default:
            item_name = "?";
            snprintf(state_buf, sizeof(state_buf), "-");
            break;
        }

        // Top: item name (left) + position "i/N" (right) - same top-row
        // slot the sensor pages use for their countdown/[STAY] indicator.
        it.print(2, 0, id(font_label), item_name);
        char pos_buf[6];
        snprintf(pos_buf, sizeof(pos_buf), "%d/%d", id(settings_menu_index) + 1, id(settings_item_count));
        it.print(126, 0, id(font_label), TextAlign::TOP_RIGHT, pos_buf);

        // Thin separator so the name row reads as a header, not just text
        // floating above the value.
        it.horizontal_line(0, 11, 128);

        // Middle: the value, big and centered - this is the one thing you
        // actually came into the menu to check/change.
        it.print(64, 14, id(font_menu_value), TextAlign::TOP_CENTER, state_buf);

        // Bottom: position dots, same visual style/spacing as the sensor
        // page indicator below - nothing else is drawn on this row now,
        // so there's nothing left for them to collide with.
        int spacing = 7;
        int start_x = 118 - (id(settings_item_count) - 1) * spacing;
        for (int i = 0; i < id(settings_item_count); i++) {
          int x = start_x + (i * spacing);
          int y = 28;
          if (i == id(settings_menu_index)) {
            it.filled_rectangle(x, y, 4, 3);
          } else {
            it.rectangle(x, y, 4, 3);
          }
        }
        return;
      }

      // --- CO2 safety alarm screen (packages/sensors.yaml sets this when
      // co2_alarm_enabled and the reading crosses the threshold) ---
      if (id(co2_alarm_active)) {
        // Blink by inverting the whole screen every 500ms - monochrome
        // OLED, so COLOR_ON/COLOR_OFF (not Color::BLACK/WHITE) are the
        // right constants here.
        bool blink_on = (millis() / 500) % 2 == 0;
        if (blink_on) it.fill(COLOR_ON);
        Color text_color = blink_on ? COLOR_OFF : COLOR_ON;

        it.printf(64, 4, id(font_label), text_color, TextAlign::TOP_CENTER, "VYSOKE CO2");
        char co2_buf[12];
        // font_big's glyph set is digits-only (see font: above), so the
        // "ppm" unit has to stay in font_label like every other page here.
        snprintf(co2_buf, sizeof(co2_buf), "%.0f ppm", id(co2_sensor).has_state() ? id(co2_sensor).state : id(cached_co2));
        it.printf(64, 18, id(font_label), text_color, TextAlign::TOP_CENTER, co2_buf);
        return;
      }

      const int page_count = 5;
      int page = (millis() / 3000) % page_count;

      const char *label;
      char value_buf[10];
      const char *unit;

      // Warm-up marker for the temperature/humidity pages. The enclosure
      // needs a long time to reach thermal equilibrium after a cold
      // power-on, and the whole temperature offset is only valid AT
      // equilibrium - so until then the number is systematically off no
      // matter how steady it looks. A "~" in front says "not trustworthy
      // yet" without hiding the value.
      //
      // Humidity gets the same marker: the SCD41 derives RH from that same
      // temperature signal, so it drifts right along with it (measured:
      // -14% in the first minute, and only within 0.5% of final from
      // ~11min - see data/2026-08-22-power-on-warmup/).
      //
      // 45min is measured, from a real cold start (device off ~1h, then
      // logged for 6.5h - data/2026-08-22-cold-start/). Taking the BMP180,
      // whose reading plateaus around 24.15C from minute 60 on, the error
      // left at each point is: -1.11C at 10min, -0.58C at 20min, -0.34C at
      // 30min, -0.18C at 40min, -0.06C at 50min. The fitted time constant
      // is ~13-15min, so it takes ~3 tau to disappear.
      //
      // This replaced an earlier 20min, which came from extrapolating a
      // capture that turned out to be a warm restart. Fitting an
      // exponential to the small tail of an almost-settled curve gave
      // tau=5.9min - less than half the real value - so the extrapolation
      // was optimistic by more than 2x. Worth remembering before trusting
      // a time constant fitted over a short window again.
      //
      // Only after a cold boot. The SCD41's own start-up transient (a
      // different, much shorter effect that DOES repeat on every wake) is
      // handled separately by a filter in packages/sensors.yaml.
      const uint32_t WARMUP_MS = 45UL * 60UL * 1000UL;

      // The same marker also covers charging, which turns out to be the
      // bigger of the two effects: measured against a reference thermometer
      // (data/2026-08-22-charging-from-empty/) the box ran up to +3.7C
      // above its settled reading while charging a flat battery, then came
      // back down as the charge current tapered off. There is no offset
      // that fixes this - see the CHARGE_OFFSET comment in
      // packages/sensors.yaml for why a constant can't work - so the
      // honest thing is to say the number isn't trustworthy right now.
      bool warming  = id(cold_boot) && millis() < WARMUP_MS;
      const char *warm = (warming || id(is_charging)) ? "~" : "";

      switch (page) {
        case 0:
          label = "CO2";
          unit = "ppm";
          snprintf(value_buf, sizeof(value_buf), "%.0f",
              id(co2_sensor).has_state() ? id(co2_sensor).state : id(cached_co2));
          break;
        case 1:
          label = "TEPLOTA";
          unit = "C";
          snprintf(value_buf, sizeof(value_buf), "%s%.1f", warm,
              id(temp_scd41).has_state() ? id(temp_scd41).state : id(cached_temp_scd41));
          break;
        case 2:
          label = "VLHKOST";
          unit = "%";
          snprintf(value_buf, sizeof(value_buf), "%s%.0f", warm,
              id(humidity_scd41).has_state() ? id(humidity_scd41).state : id(cached_humidity));
          break;
        case 3:
          label = "TLAK";
          unit = "hPa";
          snprintf(value_buf, sizeof(value_buf), "%.0f",
              id(pressure_bmp180).has_state() ? id(pressure_bmp180).state : id(cached_pressure));
          break;
        default:
          label = "TEPLOTA 2";
          unit = "C";
          snprintf(value_buf, sizeof(value_buf), "%s%.1f", warm,
              id(temp_bmp180).has_state() ? id(temp_bmp180).state : id(cached_temp_bmp180));
          break;
      }

      // 1. Left: quantity name (top)
      it.print(2, 0, id(font_label), label);

      // 2. Right: on-state indicator / countdown (top)
      if (id(stay_on)) {
        it.print(94, 0, id(font_label), "[STAY]");
      } else {
        uint32_t elapsed = (millis() - id(wake_timestamp)) / 1000;
        int remaining = 30 - (int)elapsed;
        if (remaining < 0) remaining = 0;
        char time_buf[8];
        snprintf(time_buf, sizeof(time_buf), "%ds", remaining);
        it.print(102, 0, id(font_label), time_buf);
      }

      // 3. Main value + unit
      int vx1, vy1, vw, vh;
      it.get_text_bounds(2, 11, value_buf, id(font_big), TextAlign::TOP_LEFT, &vx1, &vy1, &vw, &vh);
      it.print(2, 11, id(font_big), value_buf);
      it.print(2 + vw + 3, 11 + vh - 10, id(font_label), unit);

      // 4. Bottom-right: page indicator dots
      for (int i = 0; i < page_count; i++) {
        int x = 90 + (i * 7);
        int y = 28;
        if (i == page) {
          it.filled_rectangle(x, y, 4, 3);
        } else {
          it.rectangle(x, y, 4, 3);
        }
      }

      // 5. Battery voltage, centered between the countdown/[STAY] above and
      // the dots below, alternates V / % every 2.5 dots.
      float batt_v = id(battery_voltage).has_state() ? id(battery_voltage).state : id(cached_battery_v);
      if (batt_v > 0.0f) {
        char batt_buf[8];
        uint32_t cycle_len = page_count * 3000;
        uint32_t cycle_pos = millis() % cycle_len;
        bool show_percent = cycle_pos >= (cycle_len / 2);
        if (show_percent) {
          float batt_pct = id(battery_level).has_state() ? id(battery_level).state : id(cached_battery_pct);
          snprintf(batt_buf, sizeof(batt_buf), "%.0f%%", batt_pct);
        } else {
          snprintf(batt_buf, sizeof(batt_buf), "%.2fV", batt_v);
        }
        it.print(106, 19, id(font_label), TextAlign::CENTER, batt_buf);
      }
