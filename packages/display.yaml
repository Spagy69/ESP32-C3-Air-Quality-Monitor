font:
  - file: "gfonts://Roboto"
    id: font_big
    size: 16
    glyphs: "0123456789.-%"
  - file: "gfonts://Roboto"
    id: font_label
    size: 10

# ---------------------------------------------------------------------------
# Display, tuned for 128x32 (no clipping). Render order: settings menu, then
# the CO2 alarm screen (if active), then the normal 5-page sensor rotation.
#
# Sensor pages always prefer a sensor's live state and fall back to the
# last-known-good cached value (packages/globals.yaml, restore_value: true)
# until the first fresh reading of this boot lands - so the display shows
# correct-looking values immediately after power-on/wake instead of "--" or
# a loading bar. Cached values persist across deep sleep AND a full power
# cycle via the battery switch, since they're flash-backed.
# ---------------------------------------------------------------------------
display:
  - platform: ssd1306_i2c
    id: oled_display
    address: 0x3C
    model: "SSD1306 128x32"
    update_interval: 1s
    lambda: |-
      if (!id(display_on)) return;

      // --- Settings menu (hold button 5s+ to enter) ---
      if (id(in_settings_menu)) {
        const char *item_name;
        char state_buf[16];
        char hint_buf[20];
        switch (id(settings_menu_index)) {
          case 0: {  // REZIM - must mirror the match logic in
                     // packages/menu.yaml's 5s-hold handler exactly.
            item_name = "REZIM";
            bool is_doma = id(ha_connection_enabled)
                && !id(deep_sleep_mode_enabled)
                && !id(co2_alarm_enabled);
            bool is_cesta = !id(ha_connection_enabled)
                && id(deep_sleep_mode_enabled)
                && id(sleep_interval_minutes) == 5
                && id(co2_alarm_enabled);
            if (is_doma)       snprintf(state_buf, sizeof(state_buf), "DOMA");
            else if (is_cesta) snprintf(state_buf, sizeof(state_buf), "CESTA");
            else               snprintf(state_buf, sizeof(state_buf), "CUSTOM");
            snprintf(hint_buf, sizeof(hint_buf), "5s: prepnout");
            break;
          }
          case 1:  // HA připojení (WiFi)
            item_name = "HA PRIPOJENI";
            if (id(ha_connection_enabled)) {
              snprintf(state_buf, sizeof(state_buf), "ZAPNUTO");
              snprintf(hint_buf, sizeof(hint_buf), "5s: vypnout");
            } else {
              snprintf(state_buf, sizeof(state_buf), "VYPNUTO");
              snprintf(hint_buf, sizeof(hint_buf), "5s: zapnout");
            }
            break;
          case 2:  // Interval hlubokého spánku
            item_name = "INTERVAL SPANKU";
            snprintf(state_buf, sizeof(state_buf), "%d MIN", id(sleep_interval_minutes));
            snprintf(hint_buf, sizeof(hint_buf), "5s: dalsi hodnota");
            break;
          case 3:  // Automatický hluboký spánek
            item_name = "DEEP SLEEP";
            if (id(deep_sleep_mode_enabled)) {
              snprintf(state_buf, sizeof(state_buf), "ZAPNUTO");
              snprintf(hint_buf, sizeof(hint_buf), "5s: vypnout");
            } else {
              snprintf(state_buf, sizeof(state_buf), "VYPNUTO");
              snprintf(hint_buf, sizeof(hint_buf), "5s: zapnout");
            }
            break;
          case 4:  // Lokální CO2 alarm
            item_name = "CO2 ALARM";
            if (id(co2_alarm_enabled)) {
              snprintf(state_buf, sizeof(state_buf), "ZAPNUTO");
              snprintf(hint_buf, sizeof(hint_buf), "5s: vypnout");
            } else {
              snprintf(state_buf, sizeof(state_buf), "VYPNUTO");
              snprintf(hint_buf, sizeof(hint_buf), "5s: zapnout");
            }
            break;
          default:
            item_name = "?";
            snprintf(state_buf, sizeof(state_buf), "-");
            snprintf(hint_buf, sizeof(hint_buf), "-");
            break;
        }
        it.print(2, 0, id(font_label), item_name);
        it.print(2, 11, id(font_label), state_buf);
        it.print(2, 22, id(font_label), hint_buf);

        // Position dots, bottom-right - sized to fit settings_item_count
        // items (currently 5) within the 128px width.
        int dot_spacing = 10;
        int dots_w = id(settings_item_count) * dot_spacing;
        int start_x = 126 - dots_w;
        for (int i = 0; i < id(settings_item_count); i++) {
          int x = start_x + (i * dot_spacing);
          int y = 27;
          if (i == id(settings_menu_index)) {
            it.filled_rectangle(x, y, 5, 4);
          } else {
            it.rectangle(x, y, 5, 4);
          }
        }
        return;
      }

      // --- CO2 safety alarm screen (packages/sensors.yaml sets this when
      // co2_alarm_enabled and the reading crosses the threshold) ---
      if (id(co2_alarm_active)) {
        // Blink by inverting the whole screen every 500ms - monochrome
        // OLED, so COLOR_ON/COLOR_OFF (not Color::BLACK/WHITE) are the
        // right constants here.
        bool blink_on = (millis() / 500) % 2 == 0;
        if (blink_on) it.fill(COLOR_ON);
        Color text_color = blink_on ? COLOR_OFF : COLOR_ON;

        it.printf(64, 4, id(font_label), text_color, TextAlign::TOP_CENTER, "VYSOKE CO2");
        char co2_buf[12];
        // font_big's glyph set is digits-only (see font: above), so the
        // "ppm" unit has to stay in font_label like every other page here.
        snprintf(co2_buf, sizeof(co2_buf), "%.0f ppm", id(co2_sensor).has_state() ? id(co2_sensor).state : id(cached_co2));
        it.printf(64, 18, id(font_label), text_color, TextAlign::TOP_CENTER, co2_buf);
        return;
      }

      const int page_count = 5;
      int page = (millis() / 3000) % page_count;

      const char *label;
      char value_buf[8];
      const char *unit;

      switch (page) {
        case 0:
          label = "CO2";
          unit = "ppm";
          snprintf(value_buf, sizeof(value_buf), "%.0f",
              id(co2_sensor).has_state() ? id(co2_sensor).state : id(cached_co2));
          break;
        case 1:
          label = "TEPLOTA";
          unit = "C";
          snprintf(value_buf, sizeof(value_buf), "%.1f",
              id(temp_scd41).has_state() ? id(temp_scd41).state : id(cached_temp_scd41));
          break;
        case 2:
          label = "VLHKOST";
          unit = "%";
          snprintf(value_buf, sizeof(value_buf), "%.0f",
              id(humidity_scd41).has_state() ? id(humidity_scd41).state : id(cached_humidity));
          break;
        case 3:
          label = "TLAK";
          unit = "hPa";
          snprintf(value_buf, sizeof(value_buf), "%.0f",
              id(pressure_bmp180).has_state() ? id(pressure_bmp180).state : id(cached_pressure));
          break;
        default:
          label = "TEPLOTA 2";
          unit = "C";
          snprintf(value_buf, sizeof(value_buf), "%.1f",
              id(temp_bmp180).has_state() ? id(temp_bmp180).state : id(cached_temp_bmp180));
          break;
      }

      // 1. Left: quantity name (top)
      it.print(2, 0, id(font_label), label);

      // 2. Right: on-state indicator / countdown (top)
      if (id(stay_on)) {
        it.print(94, 0, id(font_label), "[STAY]");
      } else {
        uint32_t elapsed = (millis() - id(wake_timestamp)) / 1000;
        int remaining = 30 - (int)elapsed;
        if (remaining < 0) remaining = 0;
        char time_buf[8];
        snprintf(time_buf, sizeof(time_buf), "%ds", remaining);
        it.print(102, 0, id(font_label), time_buf);
      }

      // 3. Main value + unit
      int vx1, vy1, vw, vh;
      it.get_text_bounds(2, 11, value_buf, id(font_big), TextAlign::TOP_LEFT, &vx1, &vy1, &vw, &vh);
      it.print(2, 11, id(font_big), value_buf);
      it.print(2 + vw + 3, 11 + vh - 10, id(font_label), unit);

      // 4. Bottom-right: page indicator dots
      for (int i = 0; i < page_count; i++) {
        int x = 90 + (i * 7);
        int y = 28;
        if (i == page) {
          it.filled_rectangle(x, y, 4, 3);
        } else {
          it.rectangle(x, y, 4, 3);
        }
      }

      // 5. Battery voltage, centered between the countdown/[STAY] above and
      // the dots below, alternates V / % every 2.5 dots.
      float batt_v = id(battery_voltage).has_state() ? id(battery_voltage).state : id(cached_battery_v);
      if (batt_v > 0.0f) {
        char batt_buf[8];
        uint32_t cycle_len = page_count * 3000;
        uint32_t cycle_pos = millis() % cycle_len;
        bool show_percent = cycle_pos >= (cycle_len / 2);
        if (show_percent) {
          float batt_pct = id(battery_level).has_state() ? id(battery_level).state : id(cached_battery_pct);
          snprintf(batt_buf, sizeof(batt_buf), "%.0f%%", batt_pct);
        } else {
          snprintf(batt_buf, sizeof(batt_buf), "%.2fV", batt_v);
        }
        it.print(106, 19, id(font_label), TextAlign::CENTER, batt_buf);
      }
