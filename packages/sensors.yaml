# ---------------------------------------------------------------------------
# Sensors: SCD41 (CO2/temp/humidity), BMP180 (temp/pressure), battery
# voltage/level, charging detection + diagnostics.
#
# BMP180/battery stay at 60s (no reason to poll faster). SCD41 polls much
# faster - see the update_interval comment right below for why.
# ---------------------------------------------------------------------------
# scd41_stop_before_sleep
#
# Both paths into deep sleep (packages/menu.yaml: the display_auto_off
# script and the manual single-click handler) send this sensor
# stop_periodic_measurement (0x3F86) on the way out. Without it deep sleep
# barely saves anything, because the SCD41 is not on the ESP32's power
# domain - the 3V3 rail stays up through sleep and the sensor just carries
# on measuring every 5s with nobody listening.
#
# The cost of that is not small. The datasheet puts one measurement at
# 243mJ, so at the 5s periodic rate that is 243mJ / 5s / 3.3V = ~14.7mA
# drawn continuously, against 0.15mA typical in idle - roughly a hundred
# times more, and more than the sleeping ESP32 by orders of magnitude.
#
# It shows up in the real captures: with a 5min sleep interval and 30s
# awake - a tenth of the time powered up - the measured discharge was only
# ~15% slower than never sleeping at all (-0.070 V/h against -0.082 to
# -0.089 V/h). Working back from the always-on figure gives ~34mA total,
# which is about the ESP with WiFi plus exactly this sensor.
#
# There is independent evidence the sensor really does keep running: the
# temperature transient measured at every wake is ~5.5C, far bigger than
# the ~2C seen from a cold start, and that only makes sense if the chip
# stayed self-heated through the sleep - which it can only do by measuring.
# See data/2026-08-22-cesta-wake-cycles/.
#
# Safe to send even though ESPHome's own setup() sends stop again on the
# next boot, i.e. to an already-idle sensor: that is exactly what happens
# on every cold start (the SCD4x powers up idle), and cold starts work -
# see data/2026-08-22-cold-start/.
sensor:
  - platform: scd4x
    id: scd41_hub
    address: 0x62
    # Fast on purpose - NOT just "fresher data". The old 60s interval left
    # a CESTA wake cycle (deep sleep, display auto-off/sleep at 30s -
    # packages/menu.yaml) going back to sleep before a single real CO2
    # reading arrived. Bad for the alarm below, and HA never saw a fresh
    # reading in CESTA either - every published value stayed the boot-time
    # cached one.
    #
    # Why that happened is worth stating correctly, because an earlier
    # version of this comment got it wrong: it is NOT that the first
    # update() waits a full interval. ESPHome's scheduler starts an
    # interval at now + a random offset in [0, min(interval/2, 5000ms))
    # (Scheduler::calculate_interval_offset_), so the first poll lands
    # within 5s of setup either way. The real problem is that this early
    # poll arrives before the SCD41 flags data-ready - the driver spends
    # ~1.5s on its own stop/configure/start sequence and the sensor needs
    # another ~5s after that - so it publishes nothing, and the NEXT poll
    # is a full interval later. At 60s that lands well after the device
    # already went to sleep.
    #
    # Confirmed against a real capture (data/2026-08-22-power-on-warmup/):
    # BMP180 at its 60s interval published ~3s after boot, while the SCD41
    # at 10s only managed its first value at 11s - exactly the skipped
    # first poll.
    #
    # 5s == the SCD41's own internal sampling rate in periodic measurement
    # mode, so this is as fast as the sensor has anything new to say and
    # costs no extra sensor power - we just stop throwing readings away.
    # It puts ~5 readings in the 30s CESTA window (first at ~11s, then
    # every 5s), which is what the alarm's arming rule below needs to judge
    # whether the readings have settled and still leave room to fire.
    update_interval: 5s
    # Compiled default - stays ON unless overridden. Actually toggling ASC
    # at runtime (menu ASC KALIBRACE item) needs raw I2C, since ESPHome's
    # scd4x component only exposes this as a compile-time key - see the
    # on_boot step in air-quality-monitor.yaml and its comment for why.
    automatic_self_calibration: true
    altitude_compensation: 435m
    # Static rest-offset (self-heating with the device idle, not charging).
    # Measured against a reference thermometer, not carried over any more:
    # data/2026-08-22-rest-offset/, on battery with the charger unplugged,
    # 49min to settle, three readings five minutes apart. The old v1 value
    # of 5.6 left the reading +1.07C high, so it goes to 6.7.
    #
    # Both sanity checks on that measurement passed - the two sensors were
    # 0.35C apart (expected 0.3-0.5 at rest) and the BMP180 moved only
    # 0.09C across the three readings, so the room was not drifting under
    # us. A slow room drift is the trap here: both sensors lag the air by
    # their own 11-15min time constant, and that lag would be read as
    # offset error. What drift remained puts maybe 0.1C of the 1.07 down to
    # lag rather than offset - well inside the thermometer's own ~0.5C
    # accuracy, so it is not worth trying to subtract.
    #
    # Changing this also shifts the humidity output, since the SCD41
    # derives RH from its own offset-corrected temperature - a correction
    # downwards means RH comes out a few points higher, which is the right
    # direction. It does NOT affect CO2: per Sensirion the offset only
    # conditions the RH/T outputs.
    #
    # Sent to the SCD41 once at startup via I2C (register write), not
    # re-applied during normal operation.
    temperature_offset: 6.7°C
    co2:
      name: "CO2"
      id: co2_sensor
      filters:
        - lambda: |-
            id(cached_co2) = x;
            return x;
      # Local safety alarm for the "no HA connection" (CESTA) use case -
      # only the OLED can warn here, there's no buzzer. Forces the display
      # on with a warning screen (packages/display.yaml) and blocks the
      # automatic 30s-timeout/deep-sleep path (packages/menu.yaml) for as
      # long as the reading stays above the threshold. A manual button
      # press always still works and puts the device back to sleep - that's
      # the "acknowledge" path.
      # Hysteresis (clear below CO2_ALARM_CLEAR_PPM, not right at the
      # trigger point) avoids flicker if the reading hovers near the line.
      on_value:
        - lambda: |-
            // Thresholds confirmed with the user, not placeholders.
            const float CO2_ALARM_TRIGGER_PPM = 3000.0f;
            const float CO2_ALARM_CLEAR_PPM   = 2700.0f;

            // --- Arming: don't judge anything until the readings settle ---
            // Right after a boot the readings can be all over the place
            // (Sensirion: discard the first reading after a power cycle,
            // >3min of operation for full accuracy) - firing the alarm on
            // one of those would be a false alarm at the exact moment you
            // just switched the device on. So instead of trusting a fixed
            // delay, watch the readings themselves: arm once 3 in a row sit
            // within CO2_STABLE_SPREAD_PPM of each other.
            //
            // 150ppm is comfortably above how much real air can change
            // between two 5s readings (tens of ppm even while CO2 climbs
            // fast in a closed car) and far below the swings an unsettled
            // sensor produces.
            //
            // The fallback matters as much as the rule: if the readings
            // never calm down, the alarm still arms after 3 minutes rather
            // than staying silent forever - a noisy sensor must not mean
            // no safety net.
            //
            // Once armed it stays armed for the rest of this boot. A real
            // fast CO2 rise would blow past the spread threshold, and
            // disarming right then would kill the alarm exactly when it's
            // needed.
            const float    CO2_STABLE_SPREAD_PPM = 150.0f;
            const uint32_t CO2_ARM_FALLBACK_MS   = 3UL * 60UL * 1000UL;

            if (!id(co2_alarm_armed)) {
              if (id(co2_hist1) > 0.0f && id(co2_hist2) > 0.0f) {
                float hi = x, lo = x;
                if (id(co2_hist1) > hi) hi = id(co2_hist1);
                if (id(co2_hist1) < lo) lo = id(co2_hist1);
                if (id(co2_hist2) > hi) hi = id(co2_hist2);
                if (id(co2_hist2) < lo) lo = id(co2_hist2);
                if ((hi - lo) < CO2_STABLE_SPREAD_PPM) id(co2_alarm_armed) = true;
              }
              if (millis() > CO2_ARM_FALLBACK_MS) id(co2_alarm_armed) = true;
            }
            id(co2_hist2) = id(co2_hist1);
            id(co2_hist1) = x;

            if (!id(co2_alarm_armed)) return;

            if (!id(co2_alarm_enabled)) {
              id(co2_alarm_active) = false;
              return;
            }

            if (!id(co2_alarm_active) && x >= CO2_ALARM_TRIGGER_PPM) {
              id(co2_alarm_active) = true;
              id(stay_on) = true;
              id(display_on) = true;
              id(oled_display).turn_on();
              id(display_auto_off)->stop();
            } else if (id(co2_alarm_active) && x <= CO2_ALARM_CLEAR_PPM) {
              id(co2_alarm_active) = false;
              // Resume the normal display-timeout/sleep behavior now that
              // the air is fine again.
              id(stay_on) = false;
              id(wake_timestamp) = millis();
              id(display_auto_off)->execute();
            }
    temperature:
      name: "Temperature (SCD41)"
      id: temp_scd41
      filters:
        # Throw away the SCD41's start-up transient. For roughly the first
        # 2 minutes after ESPHome restarts periodic measurement, this sensor
        # reports several degrees too high and then decays back - and it is
        # NOT the enclosure warming up.
        #
        # Proven twice in real captures, both in data/2026-08-22-cold-start/:
        #  - From a genuinely cold start the SCD41 read 2.13C ABOVE the
        #    BMP180 at t=6s, crossed below it by t=2min, then converged to
        #    its normal +0.49C offset. A cold chip cannot read high.
        #  - When the dying battery brownout-rebooted the device at
        #    10:45:15Z, the SCD41 jumped 24.04 -> 28.42C (+4.37C) in under
        #    38 seconds while the BMP180 sat at 23.60/23.59/23.58. A 4.4C
        #    real change with the other sensor flat is impossible.
        #
        # Returning {} drops the reading entirely - not published to HA, and
        # deliberately not cached either, so the display keeps falling back
        # to the last known good value instead of a wrong one. That is what
        # went wrong before this filter existed: the device brownout-rebooted
        # as the battery died, published a transient 27.43C, and HA then sat
        # on that as the last known temperature (reality: 23.58C) - a value
        # that was never actually measured.
        #
        # Deliberately NOT applied to co2 below: its transient is only ~56ppm
        # against a 3000ppm alarm threshold, and dropping CO2 readings would
        # starve the alarm's arming rule in CESTA, where the device is awake
        # for just 30s.
        #
        # Consequence worth knowing: in CESTA nothing gets through this
        # filter at all (30s awake < 3min), so temperature/humidity there
        # stay at the last cached value. That is not a regression - CESTA
        # temperature was already wrong, just invisibly so. See README
        # Known Issues.
        - lambda: |-
            const uint32_t SCD41_SETTLE_MS = 3UL * 60UL * 1000UL;
            if (millis() < SCD41_SETTLE_MS) return {};
            return x;
        # CHARGE_OFFSET stays 0, and that is now a measured decision rather
        # than a placeholder.
        #
        # Measured against a reference thermometer over a full charge from a
        # flat battery (data/2026-08-22-charging-from-empty/): the reading
        # ran +3.7C above its own settled value at the peak of the constant-
        # current phase, held there for ~30min, then decayed back to 0 over
        # the next ~1.5h as the charge current tapered. Same shape on the
        # BMP180 (+3.8C), so it is the whole enclosure heating up, not one
        # sensor misbehaving.
        #
        # Why no constant can fix that: the heat tracks the charge CURRENT,
        # and the current depends on how empty the battery was. Charging
        # from flat gives an hour at full current; topping up from 90% gives
        # almost none. A single number would have to be wrong by up to
        # +-3.7C depending on the situation, and the mean over this charge
        # (~1.8C) would be wrong in BOTH directions. A time-since-charge-
        # start curve fails for the same reason - it is exactly what v1
        # tried, and it overshot by ~4C in the field the moment the charge
        # conditions differed from the data it was fitted to.
        #
        # A second capture confirms that dependence directly rather than by
        # argument. data/2026-08-23-charging-warm/ starts the charge from
        # 64% with the box already settled at room temperature, and peaks at
        # only +2.35C after 28min - against +3.7C from flat. Same enclosure,
        # same charger, same room, 1.4C apart purely because the battery
        # started fuller. Any constant would already be 1.4C wrong across
        # just these two runs. It also shows the shape is a hump, not a
        # step: back down to +1.4C by 62min while still plugged in.
        #
        # So the firmware does not pretend to correct it. `Charging` and
        # `Charging Duration` (below) are published to HA so charging-time
        # readings can be filtered out there, and the display marks the
        # value with "~" while charging (packages/display.yaml).
        - lambda: |-
            const float CHARGE_OFFSET_SCD41 = 0.0f;  // measured: no constant works, see above

            id(temp_raw_scd41) = x;
            id(temp_correction_extra) = id(is_charging) ? CHARGE_OFFSET_SCD41 : 0.0f;

            float corrected = x - id(temp_correction_extra);
            id(cached_temp_scd41) = corrected;
            return corrected;
        # Publish only meaningful changes. At the 5s poll rate above this
        # would otherwise write ~12 rows/min into HA's recorder for a value
        # that drifts by well under 0.2C an hour (measured, see the
        # temperature_offset comment). Deliberately AFTER the lambda, so
        # the cached value still updates on every single reading - the
        # display's fallback must not go stale just because HA doesn't
        # need the row.
        - delta: 0.05
    humidity:
      name: "Humidity"
      id: humidity_scd41
      # SCD41 computes RH internally from its own (pre-correction) temp
      # reading, which is self-heating-biased high while charging -> RH
      # comes out under-reported. The actual water vapor pressure in the
      # air doesn't change from charging, so back it out via the reported
      # RH + raw temp (Magnus approximation), then recompute RH using the
      # corrected temperature. Assumes the capacitive humidity element
      # itself isn't affected by self-heating independent of temperature -
      # only the sensor's internal RH computation is.
      filters:
        # Same start-up transient drop as the temperature above, and for the
        # same reason: RH is computed by the sensor from that same biased
        # temperature signal, so it goes wrong with it. Measured in
        # data/2026-08-22-cold-start/: at the 10:50:55Z brownout reboot the
        # published humidity jumped 64.96% -> 53.70% in one reading, and
        # that 53.70% is what HA was left holding when the battery died.
        - lambda: |-
            const uint32_t SCD41_SETTLE_MS = 3UL * 60UL * 1000UL;
            if (millis() < SCD41_SETTLE_MS) return {};
            return x;
        - lambda: |-
            if (id(temp_correction_extra) <= 0.001f) {
              id(cached_humidity) = x;
              return x;
            }

            float t_raw  = id(temp_raw_scd41);
            float t_corr = t_raw - id(temp_correction_extra);

            auto es = [](float t) {
              return 6.112f * exp(17.62f * t / (243.12f + t));
            };

            float rh = x * (es(t_raw) / es(t_corr));
            if (rh > 100.0f) rh = 100.0f;
            if (rh < 0.0f) rh = 0.0f;
            id(cached_humidity) = rh;
            return rh;
        # Same reasoning as the SCD41 temperature delta filter above, and
        # equally deliberately placed after the lambda.
        - delta: 0.1

  - platform: bmp085
    address: 0x77
    # 5s, matching the SCD41 above, so the median filters below actually have
    # a window to fill. At 60s a deep-sleep wake (~26s) delivered exactly one
    # reading, the window never filled, and with send_first_at: 1 the filter
    # published that single raw sample - i.e. it was a no-op in the mode that
    # needs it most. Proven in data/2026-08-23-cesta-baseline/: a -0.886C
    # outlier went straight through at 14:43:48 local.
    #
    # At 5s a wake delivers ~5 readings and the median works inside one boot,
    # so none of this needs flash-backed state.
    #
    # Costs nothing: a BMP180 conversion is ~5uA*s, so 0.2 readings/s averages
    # ~1uA against ~34mA for the whole device.
    update_interval: 5s
    temperature:
      name: "Temperature (BMP180)"
      id: temp_bmp180
      # Same static rest-offset approach as SCD41 above, and the same
      # answer on charging: measured at +3.8C peak on this sensor too, and
      # left uncorrected for the reasons spelled out up there.
      #
      # Rest-offset now measured against a reference thermometer rather
      # than carried over from v1 - same run as the SCD41's above
      # (data/2026-08-22-rest-offset/). The old 1.74 left this sensor
      # +0.72C high, hence 2.46.
      filters:
        # The BMP180 occasionally returns one completely wrong sample: in
        # the 1h capture (data/2026-08-22-doma-baseline/, 2026-08-22, 01:56:54Z) it read
        # 24.41C between neighbours of ~24.70C - and the SAME read also put
        # pressure at 956.41hPa against ~957.05hPa neighbours, so it's one
        # bad I2C conversion, not sensor noise on one channel. With no
        # filter at all that single value went straight to HA, to the OLED
        # and into the cache. Median-of-3 drops it outright.
        #
        # Placed BEFORE the lambda on purpose, so the cached value is the
        # cleaned one - filtering only what gets published while the rest
        # of the code reads something else is exactly the split-brain bug
        # that broke charging detection once already (see battery_voltage).
        #
        # send_every/send_first_at both 3, which is the only way ESPHome will
        # let us wait for a full window: it rejects send_first_at > send_every.
        #
        # Why wait at all: with send_first_at: 1 the first readings of every
        # boot are published as the median of a partial window, i.e. raw. In a
        # ~26s deep-sleep wake that would be most of them, which is exactly
        # the case this filter exists for.
        #
        # At the 5s poll above this publishes one fully filtered value ~13-15s
        # into each wake - comfortably inside the ~26s window (CO2 shows the
        # API is connected by ~4s), and every 15s while running continuously.
        - median:
            window_size: 3
            send_every: 3
            send_first_at: 3
        - lambda: |-
            const float REST_OFFSET_BMP180   = 2.46f;  // measured, see above
            const float CHARGE_OFFSET_BMP180 = 0.0f;   // measured: no constant works, see SCD41 above

            // The rest offset only exists while the device runs continuously.
            // cold_boot is false exactly when this boot is a deep-sleep wake,
            // which means the enclosure spent the whole sleep interval
            // settling at ambient and this reading lands ~3s after boot -
            // there is no self-heating in it to subtract.
            //
            // Measured: data/2026-08-23-cesta-baseline/ ran 12.4h at a 4.2%
            // duty cycle (26s awake per 626s) and the published temperature
            // sat 3.55C BELOW a reference thermometer - 2.46C of unearned
            // offset plus a 1.09C residual that a single reference reading
            // cannot resolve, so that part is left open on purpose.
            //
            // Order-of-magnitude check rather than a second constant: 2.46C
            // at ~34mA/4V puts the enclosure near 18 K/W, so the ~0.3mA that
            // stays alive through sleep is worth ~0.02C. Zero is the right
            // number here, not a convenient approximation.
            //
            // Keyed on physical history, not on the deep-sleep menu setting,
            // for the same reason the display picks its temperature source by
            // "does a live reading exist" instead of by mode.
            //
            // Known asymmetry left in place: after a cold power-on cold_boot
            // is true and the offset is subtracted even though the enclosure
            // is equally cold - that is the documented -1.1C at 10 minutes,
            // and it stays hidden behind the "~" warm-up marker rather than
            // being modelled from uptime (v1 was burned by exactly that class
            // of time-based correction).
            float extra = id(cold_boot) ? REST_OFFSET_BMP180 : 0.0f;
            if (id(is_charging)) extra += CHARGE_OFFSET_BMP180;

            float corrected = x - extra;
            id(cached_temp_bmp180) = corrected;
            return corrected;
        # Publish only meaningful changes, same reasoning and same placement
        # as the SCD41's delta above: at 5s polling this would otherwise put
        # ~12 rows/min into HA's recorder for a value that drifts by well
        # under 0.2C an hour. AFTER the lambda on purpose, so the cache still
        # updates on every reading and the display's fallback cannot go stale
        # just because HA does not need the row.
        - delta: 0.05
    pressure:
      name: "Pressure"
      id: pressure_bmp180
      filters:
        # Same one-bad-I2C-read glitch as the temperature above (both
        # channels came out of the same bad conversion), same fix, same
        # before-the-lambda placement so the cache stays clean too.
        - median:
            window_size: 3
            send_every: 3
            send_first_at: 3  # see the temperature median above for why
        - lambda: |-
            id(cached_pressure) = x;
            return x;
        # Same reasoning as the temperature delta above. 0.1 hPa is well under
        # any real weather trend and well over the residual noise the median
        # leaves behind.
        - delta: 0.1

  # Battery voltage via external divider, tap -> GPIO4. 30x oversampled to
  # fight the noise a high-impedance divider picks up (in place of a
  # hardware smoothing cap).
  #
  # v2: the 220k leg connects directly to the cell's B+ terminal (not the
  # XIAO BAT+ pin/TP4056 OUT+ as in v1) - see WIRING.md. The 100k/GND leg
  # is still on the XIAO's own GND (= TP4056 OUT-), same as v1. Moving the
  # 220k leg noticeably shrank the voltage jump seen right when the
  # charger connects (data/2026-08-21-v1-charger-connect/battery-voltage.csv, v1 wiring) - the v1 tap point
  # carried real extra series resistance (module traces/contacts) on top
  # of the cell's own internal resistance.
  #
  # This still tracks real charge-current-induced voltage rise, which is
  # what the charging detection below relies on.
  #
  # The 30x oversampling above only helps against noise that varies WITHIN
  # one reading (the 30 samples run back-to-back in a few ms). A noise
  # event that spans the whole burst - e.g. a WiFi TX-induced supply sag -
  # poisons all 30 samples together and oversampling can't touch it. That's
  # exactly what showed up in a real capture (data/2026-08-21-v1-charger-connect/battery-voltage.csv): one whole
  # 60s reading landed ~0.13V low while its neighbors were flat.
  #
  # BUG FOUND IN PRACTICE (fixed): an earlier version fought that with an
  # ESPHome `filters: median` step, which only smooths the PUBLISHED
  # value - the charging-detection trend/confirm-count logic below still
  # saw the raw, un-smoothed reading directly. A single noise dip could
  # silently reset charge_confirm_count right as it was building toward 3,
  # so `Charging` never latched on during a real charge session even
  # though the (separately smoothed) published voltage graphed perfectly
  # cleanly - the noise was invisible in HA but still resetting the
  # counter internally. Fix: do the median-of-3 ourselves, once, inside
  # this lambda, and use that SAME cleaned value for both the published
  # state AND the charging detection below - no more split-brain between
  # what gets published and what the state machine actually reacts to.
  #
  # state_class MUST be spelled out on every template sensor in this file.
  # The sensor platforms above (scd4x, bmp085 - and adc, the obvious
  # alternative for this one) set state_class=measurement inside their own
  # config schemas, so temperature/humidity/CO2/pressure get it for free.
  # `platform: template` sets nothing - the word does not appear in
  # template/sensor.py at all. Without this line HA receives no state class,
  # drops the entity out of long-term statistics, and raises a "state class
  # removed" repair issue offering to delete the ones already collected.
  # Do not accept that offer: HA purges the states table after 10 days, so
  # the statistics DB is the only record of battery behaviour that outlives
  # a week - i.e. exactly the data the CESTA runtime work depends on.
  - platform: template
    name: "Battery Voltage"
    id: battery_voltage
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 60s
    lambda: |-
      // TODO(v2 calibration): only the 4.15V point has been checked against
      // a multimeter so far (matched exactly). Take 2-3 more reference
      // readings across the range (e.g. ~3.5V, ~3.8V) and replace this if
      // they show a different multiplier than the divider math predicts.
      const float BATTERY_DIVIDER_MULTIPLIER = 3.2f;  // (220k+100k)/100k

      float sum_mv = 0;
      const int samples = 30;
      for (int i = 0; i < samples; i++) {
        sum_mv += analogReadMilliVolts(4);  // GPIO4, calibrated via chip's fuse-burned reference
      }
      float avg_v = (sum_mv / samples) / 1000.0;
      float raw_v = avg_v * BATTERY_DIVIDER_MULTIPLIER;

      // Median-of-3 across READINGS (see comment above for why this has
      // to happen here, not as an external filter). Plain 3-value median,
      // no library needed. Falls through to the raw reading for the
      // first two boots ever (not enough history yet).
      float v;
      if (id(batt_v_hist2) > 0.0f) {
        float a = raw_v, b = id(batt_v_hist1), c = id(batt_v_hist2);
        if ((a <= b && b <= c) || (c <= b && b <= a)) v = b;
        else if ((b <= a && a <= c) || (c <= a && a <= b)) v = a;
        else v = c;
      } else {
        v = raw_v;
      }
      id(batt_v_hist2) = id(batt_v_hist1);
      id(batt_v_hist1) = raw_v;

      // Two regimes, two rules, because the sampling differs by an order of
      // magnitude.
      //
      // Running continuously (cold_boot): one reading every 60s, and the
      // per-sample charging signal is only ~+4mV against ~18mV of noise -
      // hopeless on its own, which is why the path below averages against a
      // ~10min EWMA baseline. That path is verified against two real charge
      // captures and is NOT touched here.
      //
      // Woken from deep sleep (!cold_boot): one reading per wake, and the
      // ~10min of averaging comes free in the gap between them. A charge adds
      // ~+40mV per 10min step while discharge takes off ~1.3mV, and the
      // median leaves 2.16mV of noise - so a plain step against the previous
      // wake beats the EWMA and needs no confirmation count to latch.
      //
      // It also side-steps the end-of-charge problem entirely. The EWMA has a
      // dead zone (constant voltage -> trend 0, which sits between the latch
      // and release thresholds), and closing it took the FULL_V/flatness
      // heuristic and two rounds of tuning. A step rule has no dead zone:
      // constant voltage gives step 0, which is below the release threshold.
      if (!id(cold_boot)) {
        // Swept against both charge captures down-sampled to 10min, with the
        // overnight record as the regression - see data/threshold-sweep.py.
        //   latch:   identical results anywhere from +12 to +30mV, and zero
        //            false latches across 72 undisturbed wakes even at +10mV,
        //            so +20mV sits in the middle of a wide plateau.
        //   release: +5mV oscillates (ON->OFF->ON inside 20min) because the
        //            CV phase of a charge is flat; "< 0" does not.
        //   confirm: 2 releases 58min early, 3 lands within 2min of the
        //            measured end of charge, 4 runs past the capture. 3 is
        //            the one we can evidence, and later is the safe direction.
        const float CHARGE_STEP_V   = 0.020f;
        const int   RELEASE_CONFIRM = 3;

        // A wake is ~26s and this sensor polls at 60s, so it normally fires
        // once. A button wake or STAY can keep the device up longer and fire
        // it twice - the per-wake counters must not advance twice.
        if (!id(batt_reading_counted)) {
          id(batt_reading_counted) = true;
          float mins = (float) id(sleep_interval_minutes);

          if (id(last_wake_batt_v) > 0.0f) {
            float step = v - id(last_wake_batt_v);
            if (step > CHARGE_STEP_V) {
              if (!id(is_charging)) {
                id(is_charging) = true;
                id(charge_minutes) = 0.0f;
              }
              id(discharge_confirm_count) = 0;
              // Every rise, not just the latching one, so the "~" marker
              // stays pinned for the whole constant-current phase.
              id(disturb_minutes) = 0.0f;
            } else if (id(is_charging)) {
              if (step < 0.0f) {
                id(discharge_confirm_count)++;
                if (id(discharge_confirm_count) >= RELEASE_CONFIRM) {
                  id(is_charging) = false;
                  id(discharge_confirm_count) = 0;
                }
              } else {
                id(discharge_confirm_count) = 0;
              }
            }
          }
          id(last_wake_batt_v) = v;

          if (id(is_charging)) id(charge_minutes) += mins;
          // Stops at the cap, which also stops it writing to flash.
          if (id(disturb_minutes) < (float) ${cooldown_min}) id(disturb_minutes) += mins;
        }
      } else {
        // --- Charging detection from a slow voltage trend ---
        // A single-sample delta was tried first and missed real charging
        // entirely (real rise is only ~0.004V/min, well under any threshold
        // that also needs to reject WiFi-TX voltage sag noise). Instead:
        // track a slow moving average (~10min time constant, alpha=0.1) as
        // baseline; trend = current voltage minus that baseline. During real
        // charging the baseline lags the rising voltage enough to keep trend
        // reliably above threshold; a momentary noise spike barely moves the
        // baseline, so trend falls back quickly - combined with requiring 3
        // consecutive confirmations, that rejects noise-driven false
        // positives.
        if (id(prev_batt_v) > 0.0f) {
          if (id(batt_v_slow_avg) <= 0.0f) {
            id(batt_v_slow_avg) = v;
          }
          float trend = v - id(batt_v_slow_avg);
          id(batt_v_slow_avg) = id(batt_v_slow_avg) + 0.1f * (v - id(batt_v_slow_avg));

          bool was_charging = id(is_charging);

          if (!was_charging) {
            if (trend > 0.015f) {
              id(charge_confirm_count)++;
            } else {
              id(charge_confirm_count) = 0;
            }
            if (id(charge_confirm_count) >= 3) {
              id(is_charging) = true;
              id(charge_start_ms) = millis();
              id(charge_confirm_count) = 0;
              id(discharge_confirm_count) = 0;
              id(full_confirm_count) = 0;
            }
          } else {
            if (trend < -0.01f) {
              id(discharge_confirm_count)++;
            } else {
              id(discharge_confirm_count) = 0;
            }
            if (id(discharge_confirm_count) >= 3) {
              id(is_charging) = false;
              id(discharge_confirm_count) = 0;
              id(charge_confirm_count) = 0;
              id(full_confirm_count) = 0;
            }

            // --- End of charge: "high and flat" ---
            // The trend rule above cannot see a finished charge. Once the
            // TP4056 is done the voltage stops climbing and then sags by only
            // ~0.0009 V/min - two orders of magnitude short of the -0.01
            // threshold, so it never trips and the flag used to hang around
            // until the 3h safety net below finally cleared it. Measured in
            // data/2026-08-22-charging-from-empty/: charging actually
            // finished around 18:10 (voltage topped out at 4.150 and began
            // drifting down), but `Charging` stayed on until 19:25 - exactly
            // 3h00m03s after it latched, i.e. the safety net, not detection.
            //
            // So watch for the other signature instead: a voltage that is
            // both high AND has stopped moving. A battery still in the
            // constant-current phase climbs ~0.004 V per 60s reading; a
            // finished one moves less than 0.001.
            //
            // The thresholds are swept against real captures rather than
            // picked by feel. The first attempt used only the charge-from-
            // empty capture and landed on 4.10 / 0.001 / 5, which fires
            // there at 18:19. A second capture
            // (data/2026-08-23-charging-warm/, charger plugged in at ~64%
            // with the box already at room temperature) showed that tuning
            // is worthless: that battery tops out at 4.083 V measured, so
            // `v >= 4.10` is never true after the charge finishes and the
            // rule NEVER fires. The old numbers had been fitted to one
            // battery state, not to the hardware.
            //
            // Two things separate a finished charge from a running one, and
            // only one of them generalises:
            //
            //   - Flatness DOES. A battery in constant-current climbs
            //     ~0.004 V per 60s reading; a finished one moves less than
            //     0.002. True in both captures.
            //   - The absolute level does NOT. The two captures plateau at
            //     4.120 V and 4.083 V - 37 mV apart on the same hardware.
            //     Anything tuned tightly to one of them breaks on the other.
            //
            // So FULL_V is demoted to a loose guard (only there so a charge
            // stalled at 3.5 V can't be read as finished) and flatness does
            // the discriminating. Swept over both captures:
            //
            //   FULL_V     4.00-4.08 all identical; 4.09+ never fires on
            //              the warm capture. 4.05 keeps ~30 mV of margin
            //              below the lower of the two plateaus.
            //   DELTA      0.002 needed - the warm plateau has 60s steps up
            //              to 0.0019 V, so 0.001 rejects it as "still
            //              moving" and never confirms.
            //   CONFIRM    4..10 all land in the right window (empty
            //              18:18-18:26, warm 01:06-01:13). Only 3 is too
            //              eager, firing at 17:52 while still climbing.
            //
            // Result: fires at 4.151 V / +125 min on the empty charge and
            // 4.085 V / +48 min on the warm one. Both correct.
            //
            // If the thresholds are ever too tight for a noisier battery the
            // rule simply never fires and the 3h backstop below takes over -
            // degraded, not broken.
            const float FULL_V          = 4.05f;
            const float FULL_FLAT_DELTA = 0.002f;
            const int   FULL_CONFIRM    = 5;

            float step = v - id(prev_batt_v);
            if (step < 0.0f) step = -step;
            if (v >= FULL_V && step < FULL_FLAT_DELTA) {
              id(full_confirm_count)++;
            } else {
              id(full_confirm_count) = 0;
            }
            if (id(full_confirm_count) >= FULL_CONFIRM) {
              id(is_charging) = false;
              id(full_confirm_count) = 0;
              id(discharge_confirm_count) = 0;
              id(charge_confirm_count) = 0;
            }
          }
        } else {
          id(batt_v_slow_avg) = v;
        }
        // Last-resort backstop, now that both a real disconnect (the trend
        // rule) and a finished charge (high and flat) are detected above.
        // Nothing known should reach this any more - if `Charging Duration`
        // ever shows a clean 180.0min again, one of those two rules missed
        // something and this is covering for it.
        if (id(is_charging) && (millis() - id(charge_start_ms) > 3UL * 60UL * 60UL * 1000UL)) {
          id(is_charging) = false;
        }
      }  // end of the continuous-run path

      id(prev_batt_v) = v;
      id(cached_battery_v) = v;

      // Battery percentage is published from here rather than from its own
      // template tick. Both used to run on independent 60s intervals, and
      // ESPHome starts each component's interval at now + a random offset in
      // [0, 5s) (Scheduler::calculate_interval_offset_) - independently per
      // component. Whenever the percentage fired first it found no voltage
      // state, bailed out, and published nothing; with a ~26s awake window
      // there is no second chance that wake, so HA recorded `unknown`. That
      // happened in 21 of 72 wakes in data/2026-08-23-cesta-baseline/,
      // despite a code comment claiming the ordering made it impossible.
      //
      // Computing it here removes the race by construction: the voltage is
      // already in scope, so there is nothing to be too early for.
      const float BATT_EMPTY_V = 3.00f;
      const float BATT_FULL_V  = 4.12f;  // measured, see Battery Level below
      float pct = (v - BATT_EMPTY_V) / (BATT_FULL_V - BATT_EMPTY_V) * 100.0f;
      if (pct > 100) pct = 100;
      if (pct < 0) pct = 0;
      id(cached_battery_pct) = pct;
      id(battery_level).publish_state(pct);

      return v;

  # Rough % estimate (linear, 3.0V = 0%, 4.12V = 100%) - see README Known
  # Issues, not a precise fuel-gauge curve.
  #
  # The top of the range is measured, not the nominal 4.2 V. Two full
  # charges settle at 4.120 V (data/2026-08-22-charging-from-empty/, a
  # complete 4h charge) and 4.083 V (data/2026-08-23-charging-warm/).
  # Against a 4.2 V top, the first of those reads 93% and the second 90% -
  # i.e. the display could never show a full battery, which reads as a
  # fault rather than as the rounding it is.
  #
  # Whether the cell truly sits at 4.12 V or the divider under-reads a real
  # 4.2 V by ~2% is still open (see the multiplier TODO above), and this
  # map deliberately does not care: taking the top from what the ADC
  # actually reports when charging finishes makes the percentage
  # self-consistent either way. The 3.0 V bottom is still nominal - if the
  # divider does under-read, 0% arrives slightly early, which is the safe
  # direction.
  - platform: template
    name: "Battery Level"
    id: battery_level
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement  # template sets no default - see battery_voltage
    # No lambda and no interval on purpose: the value is pushed from the
    # battery_voltage lambda above, the moment a voltage exists. Polling this
    # on its own 60s tick is what dropped the percentage in 21 of 72 wakes -
    # the comment that used to live here claimed registration order made that
    # impossible, and the data said otherwise.
    update_interval: never

  # Diagnostic: minutes since the current charging episode started (0 when
  # not charging). Useful in Home Assistant to sanity-check the detection
  # above against real data.
  - platform: template
    name: "Charging Duration"
    id: charging_duration
    unit_of_measurement: "min"
    state_class: measurement  # template sets no default - see battery_voltage
    accuracy_decimals: 1
    update_interval: 60s
    lambda: |-
      if (!id(is_charging)) return 0.0f;
      // millis() restarts on every deep-sleep wake, so charge_start_ms can
      // only measure a charge that fits inside one boot. In deep-sleep modes
      // the battery lambda accumulates whole sleep intervals into
      // charge_minutes instead - see the "!cold_boot" branch there.
      if (!id(cold_boot)) return id(charge_minutes);
      return (millis() - id(charge_start_ms)) / 60000.0f;

binary_sensor:
  - platform: template
    name: "Charging"
    id: charging_status
    device_class: battery_charging
    lambda: |-
      return id(is_charging);
