substitutions:
  device_name: "air-quality-monitor"
  friendly_name: "Air Quality Monitor"
  # How long after a thermal disturbance the temperature stays marked "~" in
  # deep-sleep modes. Referenced from packages/globals.yaml, sensors.yaml,
  # display.yaml and menu.yaml, so it lives here rather than as four copies
  # of a literal.
  #
  # 144min is where the measured cool-down curve
  # (data/2026-08-23-cesta-baseline/) drops below 0.5C of its plateau, and
  # 0.5C is the accuracy the whole device claims - below that the reading is
  # as trustworthy as it ever gets. Rounded up to 150.
  cooldown_min: "150"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    - priority: 600
      then:
        # Was this a real cold power-on (battery switch), or just a
        # deep-sleep wake? The 3V3 rail is never cut during deep sleep, so
        # the SCD41 keeps running and stays thermally settled - only a cold
        # start has a warm-up phase where the temperature can't be trusted
        # yet. ESP_SLEEP_WAKEUP_UNDEFINED is what a normal reset/power-on
        # reports; a timer or button wake reports its own cause.
        # esp_sleep.h comes in via the deep_sleep component's header, which
        # this config already uses.
        - lambda: |-
            auto cause = esp_sleep_get_wakeup_cause();
            id(cold_boot)      = (cause == ESP_SLEEP_WAKEUP_UNDEFINED);
            id(wake_was_timer) = (cause == ESP_SLEEP_WAKEUP_TIMER);
        # Class-B state must survive deep sleep but NOT a power cycle.
        # ESPHome only offers flash-backed globals (restore_value: true),
        # which survive both, so the second half is enforced here: any boot
        # that is not a deep-sleep wake throws the sleep-scoped state away.
        #
        # Without this, `is_charging` would come back true after a week on
        # the shelf, and a stale `last_wake_batt_v` would look like a huge
        # voltage step and latch charging on the very first reading.
        #
        # cold_boot is also true after an OTA reboot, so this clears there
        # too. That is the safe direction - re-deriving beats trusting a
        # flag from before the reboot.
        #
        # disturb_minutes is reset to "settled", not to zero: a device that
        # just powered on has a cold enclosure and marking it would be
        # wrong. Its real value is set when the device actually enters
        # sleep - see packages/menu.yaml.
        - lambda: |-
            if (id(cold_boot)) {
              id(batt_v_hist1) = 0.0f;
              id(batt_v_hist2) = 0.0f;
              id(last_wake_batt_v) = 0.0f;
              id(is_charging) = false;
              id(discharge_confirm_count) = 0;
              id(charge_minutes) = 0.0f;
              id(disturb_minutes) = (float) ${cooldown_min};
            }
        - delay: 1500ms
    - priority: -100
      then:
        # On a scheduled timer wake nobody is looking - the device is only
        # up to take a reading and publish it. Lighting the OLED for the
        # full 30s window every few minutes is pure battery waste in
        # exactly the mode that exists to save battery, so keep it dark.
        #
        # Only ESP_SLEEP_WAKEUP_TIMER is treated this way. A button wake or
        # a cold start brings the display up as before - and if we ever
        # can't tell why we woke, the display wins. Failing towards "show
        # something" is the safe direction for a device whose only output
        # is that screen.
        #
        # The 30s awake window itself is unchanged: it's what WiFi, the API
        # connection and a real sensor reading need, and the display was
        # never what determined it.
        - lambda: |-
            id(stay_on) = false;
            id(display_on) = !id(wake_was_timer);
            id(wake_timestamp) = millis();
            if (id(wake_was_timer)) id(oled_display).turn_off();
        - script.execute: display_auto_off
    - priority: -150
      then:
        # SCD41 ASC (auto self-calibration) toggle from the menu (ASC
        # KALIBRACE item, packages/menu.yaml). ESPHome's scd4x component
        # only exposes automatic_self_calibration as a compile-time key and
        # re-sends the COMPILED value (true, packages/sensors.yaml) over
        # I2C on every boot - so a plain runtime toggle would get stomped
        # right back at the next wake. This only needs to act when the
        # user has turned it OFF (away from the compiled default) - turning
        # it back on needs nothing extra, ESPHome's own setup() already
        # re-applies the compiled "true" on every boot regardless.
        #
        # Raw I2C per the SCD4x datasheet: must be in idle mode to change
        # ASC, so stop periodic measurement, wait, send the command, then
        # resume. Not using scd4x.persist_settings (0x2313) on purpose - it
        # writes the sensor's own NVM (limited write cycles) and we don't
        # need it there, since id(asc_enabled) already persists our choice
        # in the ESP32's own flash and this step re-applies it every boot
        # where it matters.
        - lambda: |-
            if (!id(asc_enabled)) {
              id(scd41_hub).write_command((uint16_t) 0x3F86);              // stop_periodic_measurement
              delay(500);                                                   // datasheet: idle >=500ms before other commands
              id(scd41_hub).write_command((uint16_t) 0x2416, (uint16_t) 0); // set_automatic_self_calibration_enabled = false
              delay(1);
              id(scd41_hub).write_command((uint16_t) 0x21B1);              // start_periodic_measurement
            }
    - priority: -200
      then:
        # WiFi doesn't auto-enable (enable_on_boot: false below) - restored
        # here from the persistent "HA připojení" setting (menu, REZIM /
        # HA PRIPOJENI items - see packages/menu.yaml).
        - if:
            condition:
              lambda: 'return id(ha_connection_enabled);'
            then:
              - wifi.enable:

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: arduino

logger:
  level: NONE

api:
  encryption:
    key: !secret api_encryption_key
  # Without this, ESPHome would reboot the device itself if API/WiFi stay
  # disabled for a while - the opposite of what the power-saving CESTA
  # preset needs.
  reboot_timeout: 0s

ota:
  platform: esphome
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: light
  # Enabling is deferred to the on_boot step above, driven by the
  # persistent ha_connection_enabled setting.
  enable_on_boot: false
  # Same reasoning as api.reboot_timeout above - WiFi staying off for a
  # long time (CESTA preset) is intentional, not a fault to reboot over.
  reboot_timeout: 0s
  ap:
    ssid: "${device_name} Fallback"
    password: !secret fallback_ap_password

captive_portal:

# Buffers globals.restore_value writes (cached sensor values, persistent
# settings) and flushes them to flash on this interval instead of on every
# change. Short on purpose: a wake cycle here (sense -> publish -> sleep)
# can finish well inside the 1min default, and losing the last cached
# reading when power drops for deep sleep would defeat the point of
# caching it.
preferences:
  flash_write_interval: 1s

# Power-saving deep sleep - see packages/menu.yaml (DEEP SLEEP toggle,
# INTERVAL SPANKU) for how it's triggered/configured from the menu.
# Never sleeps on its own (no run_duration) - only via deep_sleep.enter.
# sleep_duration below is just the fallback; it's overwritten via
# set_sleep_duration() before every real sleep based on
# id(sleep_interval_minutes).
#
# wakeup_pin syntax for the ESP32-C3 hasn't been verified on real hardware
# yet - if button-wake doesn't work, check the compile/flash logs first.
deep_sleep:
  id: deep_sleep_1
  sleep_duration: 10min
  wakeup_pin:
    number: GPIO3
    inverted: true
    allow_other_uses: true

i2c:
  sda: GPIO6
  scl: GPIO7
  frequency: 100kHz
  scan: true
  sda_pullup_enabled: false
  scl_pullup_enabled: false

packages:
  - !include packages/globals.yaml
  - !include packages/sensors.yaml
  - !include packages/display.yaml
  - !include packages/menu.yaml
